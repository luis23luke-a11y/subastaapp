# Ingesta del Portal de Subastas del BOE, en cadena: cada pasada lanza la
# siguiente al terminar, y el horario de cada 15 minutos queda solo de respaldo
# por si la cadena se corta. Medido el 26/10/2026: el horario de GitHub solo
# disparo dos pasadas en siete horas, tambien con minutos desplazados, asi que
# no vale como unico lanzador.
#
# El worker (src/ingesta/worker.ts) es un proceso Node normal con tope de
# tiempo: lo que no le da tiempo a hacer se queda en la cola de Postgres para
# la siguiente pasada, y los trabajos a medias de una pasada que murio vuelven
# solos a la cola. Por eso basta con un cron corriente y no hace falta tocar
# Vercel. La seccion "La ingesta en produccion" del README explica por que
# GitHub Actions y no Vercel Cron.
#
# Configuracion, en GitHub -> Settings -> Secrets and variables -> Actions:
#   DATABASE_URL   secreto. La misma cadena de Neon que usa Vercel.
#   BOE_CONTACTO   variable (no secreto). Correo que va en el User-Agent para
#                  que el BOE pueda escribir si el ritmo le molesta.
#
# Cada lote de trabajos reserva la mitad para fichas nuevas y un cuarto para
# enriquecer bienes (Catastro, coordenadas, valoracion), y un refresco pide
# solo dos pestañas del portal; la regla y las cifras estan en el README, en
# "Como se reparte una pasada", "Enriquecimiento con el Catastro" y "La
# ingesta en produccion".
#
# Dos cosas de GitHub que conviene saber: los "schedule" solo se disparan en la
# rama por defecto (main), y GitHub los desactiva si el repositorio pasa 60 dias
# sin actividad; un push cualquiera los vuelve a activar.

name: Ingesta BOE

on:
  schedule:
    # Respaldo: si la cadena se corta (un fallo de GitHub, una pasada que se
    # cancela a mano), el horario la vuelve a arrancar. Minutos "raros" a
    # proposito: a las en punto y a los cuartos GitHub acumula cola y descarta
    # pasadas programadas.
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:
    inputs:
      presupuesto:
        description: Tope de la pasada, en segundos
        default: "840"
        required: false
  # Para probar un cambio del workflow antes de fusionarlo: un push que toque
  # este fichero en una rama que no sea main lanza una pasada real. Es la unica
  # forma de ejecutarlo desde una rama, porque "Run workflow" y gh workflow run
  # solo ven los workflows que ya existen en main. Sirve tambien para probar un
  # cambio del worker: la ultima linea del log dice cuantas fichas fueron
  # nuevas y cuantas actualizadas, y debajo sale la cola por tipo y estado
  # (npm run db:estado la enseña tambien, con las ultimas pasadas).
  push:
    branches-ignore: [main]
    paths: [".github/workflows/ingesta-boe.yml"]

# Dos pasadas a la vez no se pisarian (la toma de trabajos usa "for update skip
# locked"), pero doblarian el ritmo de peticiones al portal, que es justo lo que
# no queremos. Con esto la segunda espera a que acabe la primera.
concurrency:
  group: ingesta-boe
  cancel-in-progress: false

# "actions: write" es lo que permite a una pasada lanzar la siguiente con el
# token del propio workflow. GitHub no crea pasadas a partir de eventos de ese
# token, salvo precisamente workflow_dispatch y repository_dispatch.
permissions:
  contents: read
  actions: write

jobs:
  ingesta:
    runs-on: ubuntu-latest
    # 14 minutos de worker mas instalar dependencias. Si algo se cuelga de
    # verdad, GitHub lo corta aqui y "rescatar" devuelve sus trabajos a la cola.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Avisar si falta el correo de contacto
        if: vars.BOE_CONTACTO == ''
        run: echo "::warning::BOE_CONTACTO no esta definida; el User-Agent ira sin correo de contacto. Ponla en Settings -> Secrets and variables -> Actions -> Variables."

      - name: Una pasada del worker contra el Portal de Subastas del BOE
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BOE_CONTACTO: ${{ vars.BOE_CONTACTO }}
          DB_DRIVER: tcp
          DB_MAX_CONEXIONES: "4"
        run: npm run ingesta -- --adaptador=boe --presupuesto=${{ inputs.presupuesto || '840' }}

      - name: Encadenar la siguiente pasada
        # Solo desde main: una prueba lanzada desde una rama no debe arrancar
        # una cadena. Y aunque esta pasada haya fallado: una ficha rota o un
        # corte de red no deben parar la ingesta.
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Si ya hay otra pasada en cola o en marcha (el horario de respaldo, o
          # alguien que pulso "Run workflow"), no se lanza otra: con dos cadenas
          # el ritmo de peticiones al portal se doblaria.
          otras=$(gh run list --workflow=ingesta-boe.yml --limit 30 --json databaseId,status \
            --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending" or .status == "requested")
                        | select(.databaseId != ${{ github.run_id }})] | length')
          if [ "$otras" != "0" ]; then
            echo "Hay $otras pasada(s) en cola o en marcha: no se encadena otra."
            exit 0
          fi
          # Un minuto de respiro para el portal entre pasada y pasada.
          sleep 60
          gh workflow run ingesta-boe.yml --ref main
          echo "Siguiente pasada lanzada."
